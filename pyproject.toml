[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-network-from-scratch"
version = "0.1.0"
description = "Research-oriented hardware-aware neural network from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
neurospec-train = "neurospec.cli:main"
train = "scripts.run_research_suite:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["neurospec"]
