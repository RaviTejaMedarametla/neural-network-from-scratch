[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-network-from-scratch"
version = "0.1.0"
description = "A from-scratch neural network library with hardware-aware research extensions"
authors = [{name = "RaviTejaMedarametla"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "scipy>=1.7",
]

[project.scripts]
neurospec-train = "scripts.run_research_suite:main"
