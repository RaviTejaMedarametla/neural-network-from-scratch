name: Update Performance Metrics

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  # Required for committing updated README/metrics artifacts back to the repository.
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests psutil tqdm

      - name: Collect model metrics
        id: collect_metrics
        continue-on-error: true
        run: |
          # Avoid accidentally reusing stale metrics from a prior run.
          rm -f metrics.json
          python scripts/collect_metrics.py \
            --epochs 5 \
            --min-acceptable-accuracy 80.0 \
            --no-synthetic-fallback \
            --output metrics.json

      - name: Update README metrics section
        if: ${{ always() }}
        run: |
          python scripts/update_readme.py \
            --metrics metrics.json \
            --readme README.md \
            --last-good-metrics artifacts/last_good_metrics.json \
            --min-acceptable-accuracy 80.0 \
            --publish-min-accuracy 92.0 \
            --publish-min-time 30.0 \
            --publish-max-time 120.0 \
            --publish-min-memory 100.0 \
            --publish-max-memory 500.0

      - name: Generate run metrics report
        if: ${{ always() }}
        run: |
          if [ -f metrics.json ]; then
            python scripts/generate_metrics_report.py --metrics metrics.json --output artifacts/metrics_report.md
          else
            echo "metrics.json not found; skipping report generation"
          fi

      - name: Optional sanity gate for low accuracy
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metrics_path = Path("metrics.json")
          if not metrics_path.exists():
            print("metrics.json missing; skipping sanity gate")
            raise SystemExit(0)

          metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
          accuracy = float(metrics.get("test_accuracy_percent", -1.0))
          threshold = 80.0
          if accuracy < threshold:
            raise SystemExit(
              f"Sanity gate failed: accuracy {accuracy:.4f}% is below threshold {threshold:.2f}%"
            )
          print(f"Sanity gate passed: accuracy {accuracy:.4f}% >= {threshold:.2f}%")
          PY

      - name: Commit and push changes
        if: ${{ always() }}
        run: |
          TRACKED_FILES=(README.md metrics.json artifacts/metrics_report.md artifacts/last_good_metrics.json)
          EXISTING_FILES=()
          for file in "${TRACKED_FILES[@]}"; do
            if [ -e "$file" ]; then
              EXISTING_FILES+=("$file")
            fi
          done

          if [ ${#EXISTING_FILES[@]} -eq 0 ]; then
            echo "No metrics artifacts exist to commit."
            exit 0
          fi

          if git diff --quiet -- "${EXISTING_FILES[@]}"; then
            echo "No metrics changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${EXISTING_FILES[@]}"
          git commit -m "docs: update performance metrics [skip ci]"
          git push
