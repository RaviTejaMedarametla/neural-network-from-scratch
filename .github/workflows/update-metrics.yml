name: Update Performance Metrics

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests psutil tqdm

      - name: Collect model metrics
        id: collect_metrics
        continue-on-error: true
        timeout-minutes: 12
        run: |
          rm -f metrics.json
          python scripts/collect_metrics.py \
            --epochs 5 \
            --min-acceptable-accuracy 80.0 \
            --no-synthetic-fallback \
            --output metrics.json

      - name: Ensure fallback metrics payload exists
        if: ${{ always() }}
        run: |
          if [ ! -f metrics.json ]; then
            python scripts/write_failure_metrics.py \
              --output metrics.json \
              --error "collect_metrics step failed or timed out"
          fi

      - name: Update README metrics section
        if: ${{ always() }}
        run: |
          python scripts/update_readme.py \
            --metrics metrics.json \
            --readme README.md \
            --last-good-metrics artifacts/last_good_metrics.json \
            --min-acceptable-accuracy 80.0 \
            --publish-min-accuracy 92.0 \
            --publish-min-time 30.0 \
            --publish-max-time 120.0 \
            --publish-min-memory 100.0 \
            --publish-max-memory 500.0

      - name: Generate run metrics report
        if: ${{ always() }}
        run: |
          python scripts/generate_metrics_report.py --metrics metrics.json --output artifacts/metrics_report.md

      - name: Optional sanity gate for low accuracy
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metrics_path = Path("metrics.json")
          if not metrics_path.exists():
            print("metrics.json missing; skipping sanity gate")
            raise SystemExit(0)

          metrics = json.loads(metrics_path.read_text(encoding="utf-8"))

          if bool(metrics.get("bad_metrics", False)):
            print("metrics.json marked bad_metrics=true; skipping optional sanity gate")
            raise SystemExit(0)

          accuracy = float(metrics.get("test_accuracy_percent", -1.0))
          threshold = 80.0
          if accuracy < 0:
            print("test_accuracy_percent missing/invalid; skipping optional sanity gate")
            raise SystemExit(0)

          if accuracy < threshold:
            raise SystemExit(
              f"Sanity gate failed: accuracy {accuracy:.4f}% is below threshold {threshold:.2f}%"
            )
          print(f"Sanity gate passed: accuracy {accuracy:.4f}% >= {threshold:.2f}%")
          PY

      - name: Select files safe to commit
        if: ${{ always() }}
        id: select_files
        run: |
          python scripts/select_metrics_commit_files.py > /tmp/metrics_files.txt
          if [ ! -s /tmp/metrics_files.txt ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed, non-ignored metrics files to commit."
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Selected files:"
            cat /tmp/metrics_files.txt
          fi

      - name: Commit and push changes
        if: ${{ always() && steps.select_files.outputs.has_files == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -a /tmp/metrics_files.txt git add --
          if git diff --cached --quiet; then
            echo "No staged changes after selection."
            exit 0
          fi
          git commit -m "docs: update performance metrics [skip ci]"
          git push
