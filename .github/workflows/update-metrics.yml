name: Update Performance Metrics

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests psutil tqdm

      - name: Collect model metrics
        run: |
          python scripts/collect_metrics.py --epochs 5 --output metrics.json

      - name: Update README metrics section
        run: |
          python scripts/update_readme.py --metrics metrics.json --readme README.md

      - name: Commit and push changes
        run: |
          if git diff --quiet -- README.md metrics.json; then
            echo "No metrics changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics.json
          git commit -m "docs: update performance metrics [skip ci]"
          git push
