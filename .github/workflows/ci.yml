name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify environment
        run: python scripts/verify_environment.py
      - name: Prepare offline dataset fixtures
        run: python scripts/prepare_offline_dataset.py
      - name: Run tests
        run: |
          python -m unittest \
            'Neural Network from Scratch/task/test/test_vectorized_model.py' \
            'Neural Network from Scratch/task/test/test_benchmark.py' \
            'Neural Network from Scratch/task/test/test_profiler_and_scaling.py' \
            'Neural Network from Scratch/task/test/test_hardware_and_experiment_manager.py' \
            'Neural Network from Scratch/task/test/test_deployment_onnx.py' \
            'Neural Network from Scratch/task/test/test_real_dataset_pipeline.py'
      - name: Validate ONNX CLI export
        run: |
          python 'Neural Network from Scratch/task/train.py' --experiment baseline
          python 'Neural Network from Scratch/task/inference.py' --weights experiments/checkpoints/baseline_v1.npz --export-onnx
